ashigaru: 2
task_id: task-pro-pages-A
priority: high
description: |
  以下5本のアプリの Pro ページを実装し、無料版ページにも学習機能を追加せよ。

  === Pro ページ実装パターン ===
  app/apps/tetris/pro/page.tsx を参照。
  - export const dynamic = 'force-dynamic'
  - ログイン未ログイン → /auth/login へ誘導
  - 未購入 → 購入フォーム（action="/api/stripe/checkout" method="POST"）
  - 購入済み → プレースホルダーでOK

  === 無料版ページへの学習機能追加 ===
  app/apps/tetris/page.tsx を参照パターンとして使用。
  各ゲームの page.tsx (無料版) に以下を追加:

  1. インポート追加:
     import { FlowEngine, type RewardEvent } from '@/lib/flow-engine';
     import { FreemiumGate, GAME_FREEMIUM_CONFIGS } from '@/lib/freemium-gate';
     import { ProWallModal, ScorePopup, FlowIndicator } from '@/app/components/ProWallModal';
     import { recordGameResult } from '@/lib/learning';

  2. useEffect で初期化:
     const flowRef = useRef<FlowEngine | null>(null);
     const gateRef = useRef<FreemiumGate | null>(null);
     useEffect(() => {
       flowRef.current = new FlowEngine('<slug>');
       const cfg = GAME_FREEMIUM_CONFIGS['<slug>'];
       gateRef.current = new FreemiumGate({ slug: '<slug>', ...cfg });
     }, []);

  3. ゲーム正解/不正解時:
     const events = flowRef.current?.onCorrect() ?? [];
     // または
     flowRef.current?.onWrong();

  4. JSX に追加:
     <ScorePopup events={rewardEvents} />
     {showProWall && <ProWallModal slug="<slug>" price={<price>} ... />}
     <FlowIndicator streak={...} level={...} xp={...} hookMessage={...} />

  5. Pro壁表示タイミング:
     - FreemiumGate.canPlay() が false になった時
     - または既存のレベル制限に達した時

