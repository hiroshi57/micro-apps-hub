name: Check Secrets & Dry Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'チェック対象 (all / note / instagram)'
        required: false
        default: 'all'

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check secrets availability
        run: |
          echo "=== Secrets チェック ==="
          MISSING=0

          check_secret() {
            local name=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "❌ $name: 未設定"
              MISSING=$((MISSING + 1))
            else
              echo "✅ $name: 設定済み (${#value}文字)"
            fi
          }

          check_secret "NOTE_SESSION"             "${{ secrets.NOTE_SESSION }}"
          check_secret "INSTAGRAM_ACCESS_TOKEN"   "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          check_secret "INSTAGRAM_USER_ID"        "${{ secrets.INSTAGRAM_USER_ID }}"

          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "⚠️  $MISSING 個の Secret が未設定です。"
            echo "    GitHub リポジトリ → Settings → Secrets and variables → Actions で設定してください。"
            echo ""
            echo "必要な Secret:"
            echo "  NOTE_SESSION         - Note.com ブラウザの __session クッキー値"
            echo "  INSTAGRAM_ACCESS_TOKEN - Instagram Graph API 長期アクセストークン"
            echo "  INSTAGRAM_USER_ID      - Instagram ビジネスアカウントの数値 ID"
          else
            echo "✅ 全 Secret が設定済みです！"
          fi

      - name: Dry run — Note 投稿プレビュー
        if: ${{ inputs.target == 'all' || inputs.target == 'note' }}
        run: |
          echo "=== Note 投稿 dry-run ==="
          node scripts/post-to-note.js --dry-run

      - name: Dry run — Instagram キャプションプレビュー
        if: ${{ inputs.target == 'all' || inputs.target == 'instagram' }}
        run: |
          echo "=== Instagram 投稿 dry-run ==="
          node scripts/post-to-instagram.js --dry-run
