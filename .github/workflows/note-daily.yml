name: Note Daily Post

on:
  schedule:
    # 毎日 07:00 JST (= 22:00 UTC 前日)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: '投稿するアプリのスラッグ (省略時: 日替わり)'
        required: false
        default: ''
      dry_run:
        description: 'dry-run モード (true/false)'
        required: false
        default: 'false'

jobs:
  post-to-note:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post to Note
        env:
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS=""
          [ -n "$SLUG"         ] && ARGS="$ARGS $SLUG"
          [ "$DRY" = "true"    ] && ARGS="$ARGS --dry-run"
          echo "▶ node scripts/post-to-note.js$ARGS"
          node scripts/post-to-note.js$ARGS

      - name: Notify on failure
        if: failure()
        run: echo "::error::Note 投稿に失敗しました。NOTE_SESSION シークレットを確認してください。"
